name: Routing question
description: Something you see in /iq that you do not understand, or that you expected to be different.
title: "[Routing]: "
labels: ["Routing", "question"]
body:
  - type: markdown
    attributes:
      value: |
        Routing is opt-in. It only uses a model at or below the one you chose. Tell us what you expected and what you saw.

        Please do not paste prompts, API keys, tokens or file paths anywhere in this form.

        The first five boxes can be filled in by the `/iq feedback` link. They hold only your IQ Code version, your OS, your Claude Code version, the routing status and the last error code.
  - type: input
    id: iq_version
    attributes:
      label: IQ Code version
      placeholder: "for example 1.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "for example macOS 15.1, Linux or Windows"
    validations:
      required: true
  - type: input
    id: claude_code_version
    attributes:
      label: Claude Code version
      placeholder: "for example 2.1.280"
    validations:
      required: true
  - type: input
    id: routing
    attributes:
      label: Routing status
      description: "As /iq feedback shows it: on, off, or the reason routing is not running."
    validations:
      required: true
  - type: input
    id: last_error
    attributes:
      label: Last error code
      description: "As /iq feedback shows it. Write none if there was no error."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What you saw
      description: What /iq showed, in your own words.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed prompts, API keys, tokens and file paths from this report.
          required: true
